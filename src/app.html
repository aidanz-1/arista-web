<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png?v=20260831" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

		<!-- iOS Web App Meta Tags -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Arista" />
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- iOS Icons -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png?v=20260831" />
		<link
			rel="apple-touch-icon"
			sizes="152x152"
			href="%sveltekit.assets%/apple-touch-icon-152x152.png?v=20260831"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon-180x180.png?v=20260831"
		/>
		<link
			rel="apple-touch-icon"
			sizes="167x167"
			href="%sveltekit.assets%/apple-touch-icon-167x167.png?v=20260831"
		/>

		<!-- Web App Manifest -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json?v=20260831" />

		<meta name="theme-color" content="#22397D" />
		<meta name="msapplication-TileColor" content="#22397D" />

		<!-- Service Worker Registration -->
		<script>
			if ("serviceWorker" in navigator) {
				window.addEventListener("load", () => {
					navigator.serviceWorker.register("/sw.js").catch(() => undefined);
				});
			}
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" data-theme="wintry">
		<div style="display: contents" class="h-full overflow-hidden">%sveltekit.body%</div>
	</body>
</html>
